# Package outlines as seen from above, nominal dimensions in millimeters.
#
# Frame: u runs along the package length, v across it, origin at the body
# center (the point a pick-and-place machine centers on the nozzle). With
# angle 0 the package is drawn as written here: +u to the right, +v up.
#
# body      = [length, width], centered on the origin.
# terminal  = end-cap length of a two-terminal chip; the caps lie on the body
#             and do not change the outline.
# leads     = rectangles [u_center, v_center, u_size, v_size] that stick out
#             of the body and extend the outline. Pin 1 is the first entry.
# body_color, lead_color = BGR colors used only by the synthetic renderer.

# Two-terminal chips: EIA-198 / IEC 60115-8 nominal case sizes. The silhouette
# is a plain rectangle, so the angle is reported modulo 180 degrees.

[packages."0201"]
kind = "chip"
body = [0.6, 0.3]
terminal = 0.15

[packages."0402"]
kind = "chip"
body = [1.0, 0.5]
terminal = 0.25

[packages."0603"]
kind = "chip"
body = [1.6, 0.8]
terminal = 0.3

[packages."0805"]
kind = "chip"
body = [2.0, 1.25]
terminal = 0.4

[packages."1206"]
kind = "chip"
body = [3.2, 1.6]
terminal = 0.5

# SOT-23 (JEDEC TO-236AB): D 2.9, E1 1.3, E 2.4, e 1.9, e1 0.95, b 0.4.
# Leads reach (E - E1) / 2 = 0.55 past the body. Pins 1 and 2 on the bottom
# edge, pin 3 centered on the top edge, so the outline fixes the full 360
# degrees.
[packages.SOT-23]
kind = "ic"
body = [2.9, 1.3]
leads = [
    [-0.95, -0.925, 0.4, 0.55],
    [0.95, -0.925, 0.4, 0.55],
    [0.0, 0.925, 0.4, 0.55],
]

# SOT-23-5 (JEDEC MO-178AA): D 2.9, E1 1.6, E 2.8, e 0.95, b 0.4. Leads reach
# 0.6 past the body. Pins 1-3 on the bottom edge, pins 4-5 on the top edge.
[packages.SOT-23-5]
kind = "ic"
body = [2.9, 1.6]
leads = [
    [-0.95, -1.1, 0.4, 0.6],
    [0.0, -1.1, 0.4, 0.6],
    [0.95, -1.1, 0.4, 0.6],
    [0.95, 1.1, 0.4, 0.6],
    [-0.95, 1.1, 0.4, 0.6],
]

# SOT-23-6 (JEDEC MO-178AB): as SOT-23-5 with three leads per side, so the
# outline is symmetric under 180 degrees.
[packages.SOT-23-6]
kind = "ic"
body = [2.9, 1.6]
leads = [
    [-0.95, -1.1, 0.4, 0.6],
    [0.0, -1.1, 0.4, 0.6],
    [0.95, -1.1, 0.4, 0.6],
    [0.95, 1.1, 0.4, 0.6],
    [0.0, 1.1, 0.4, 0.6],
    [-0.95, 1.1, 0.4, 0.6],
]

# SOD-123 (onsemi case 425): body D 2.7 x E 1.6, overall HE 3.7, lead width
# b 0.6. Leads reach 0.5 past each end. The cathode band is on the body only,
# so the outline is symmetric under 180 degrees.
[packages.SOD-123]
kind = "ic"
body = [2.7, 1.6]
leads = [
    [-1.6, 0.0, 0.5, 0.6],
    [1.6, 0.0, 0.5, 0.6],
]

# SOIC-8 (JEDEC MS-012AA): D 4.9, E1 3.9, E 6.0, e 1.27, b 0.42. Leads reach
# 1.05 past the body. Pins 1-4 on the bottom edge, left to right. Pin 1 is
# marked only by a dot or bevel, so the outline gives the angle modulo 180.
[packages.SOIC-8]
kind = "ic"
body = [4.9, 3.9]
leads = [
    [-1.905, -2.475, 0.42, 1.05],
    [-0.635, -2.475, 0.42, 1.05],
    [0.635, -2.475, 0.42, 1.05],
    [1.905, -2.475, 0.42, 1.05],
    [1.905, 2.475, 0.42, 1.05],
    [0.635, 2.475, 0.42, 1.05],
    [-0.635, 2.475, 0.42, 1.05],
    [-1.905, 2.475, 0.42, 1.05],
]

# QFN-16 3x3 (JEDEC MO-220 VEED): a square body with the pads underneath, so
# the outline gives the angle modulo 90.
[packages.QFN-16]
kind = "ic"
body = [3.0, 3.0]
